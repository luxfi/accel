name: accel-ci

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

env:
  GOPRIVATE: github.com/luxfi/*
  GONOSUMDB: github.com/luxfi/*

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch luxcpp accel deps
        continue-on-error: true
        env:
          LUXCPP_VERSION: v0.1.0
        run: make fetch-deps
      - name: Install deps (no sudo)
        continue-on-error: true
        env:
          LUXCPP_VERSION: v0.1.0
          INSTALL_PREFIX: ${{ github.workspace }}/.deps
          SUDO: ""
        run: make install-deps
      - name: Test with CGO
        continue-on-error: true
        env:
          LUXCPP_VERSION: v0.1.0
          INSTALL_PREFIX: ${{ github.workspace }}/.deps
          LD_LIBRARY_PATH: ${{ github.workspace }}/.deps/lib
        run: make test
      - name: Test without CGO (fallback)
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch luxcpp accel deps
        continue-on-error: true
        env:
          LUXCPP_VERSION: v0.1.0
        run: make fetch-deps
      - name: Install deps (no sudo)
        continue-on-error: true
        env:
          LUXCPP_VERSION: v0.1.0
          INSTALL_PREFIX: ${{ github.workspace }}/.deps
          SUDO: ""
        run: make install-deps
      - name: Test with CGO
        continue-on-error: true
        env:
          LUXCPP_VERSION: v0.1.0
          INSTALL_PREFIX: ${{ github.workspace }}/.deps
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/.deps/lib
        run: make test
      - name: Test without CGO (fallback)
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (no CGO on Windows)
        env:
          CGO_ENABLED: 0
        run: go test ./...
